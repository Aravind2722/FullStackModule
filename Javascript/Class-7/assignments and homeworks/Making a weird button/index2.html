<!DOCTYPE html>
<html>
<!-- Please NOTE that the link to assets (like images) need to be set in global context.
For example:
To access an image from assets folder correct way to set src attribute is 

src = 'profile.png'

instead of 

src = './assets/profile.png'
-->

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <div id="doubleHolder">
        <button class="double">double</button>
    </div>

    <script>
        // Write your JS program here =========
        const doubleHolder = document.querySelector('#doubleHolder');
        window.addEventListener("click", (event) => {
            if (event.target.classList.contains('double')) {
                const button = event.target;
                button.remove();
                doubleHolder.appendChild(createButton());
                doubleHolder.appendChild(createButton());
            }
        });

        function createButton() {
            const button = document.createElement('button');
            button.setAttribute('class', 'double');
            button.innerText = 'double';
            return button;
        }

    </script>
</body>

</html>
