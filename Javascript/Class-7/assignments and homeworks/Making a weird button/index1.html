<!DOCTYPE html>
<html>
<!-- Please NOTE that the link to assets (like images) need to be set in global context.
For example:
To access an image from assets folder correct way to set src attribute is 

src = 'profile.png'

instead of 

src = './assets/profile.png'
-->

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <div id="doubleHolder">
        <button class="double">double</button>
    </div>

    <script>
        // Write your JS program here =========
        const doubleHolder = document.querySelector('#doubleHolder');
        const button = document.querySelector('.double');
        handleClickEvent(button);

        function handleClickEvent(button) {
            button.addEventListener("click", () => {
                button.remove();
                const newButton1 = createButton();
                const newButton2 = createButton();

                doubleHolder.appendChild(newButton1);
                doubleHolder.appendChild(newButton2);
                
                handleClickEvent(newButton1);
                handleClickEvent(newButton2);
            });
        }

        function createButton() {
            const button = document.createElement('button');
            button.textContent = 'double';
            button.className = 'double';
            return button;
        }
        // function createButton() {
        //     const button = document.createElement('button');
        //     button.textContent = 'double';
        //     button.className = 'double';
        //     doubleHolder.appendChild(button);
        //     handleClickEvent(button);
        // }

    </script>
</body>

</html>
