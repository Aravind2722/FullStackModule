<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
      }
      div {
        height: 100vh;
        width: 100vw;
        background: red;
      }
      .tablet {
        background: blue;
      }
      .mobile {
        background: green;
      }
      
    </style>
  </head>
  <body>
    <div></div>
    <script>
        const div = document.querySelector("div");
        window.addEventListener("resize", (event) => {
            if (window.innerWidth > 1024) div.className = '';
            else if (window.innerWidth <= 1024 && window.innerWidth > 600) div.className = 'tablet';
            else div.className = 'mobile';
        });
    </script>
  </body>
</html>
